<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>여행 정산 | Trip Splitter</title>
  <link rel="preload" href="assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <header>
    <div class="wrap title">
      <div>
        <h1>여행 정산 · Trip Splitter</h1>
      </div>
      <div style="flex:1"></div>
      <button id="resetBtn" class="btn warn" title="모든 데이터를 초기화합니다">초기화</button>
    </div>
  </header>

  <main class="wrap">
    <!-- Auth Section -->
    <section class="card" id="authSection" style="margin-bottom:16px">
      <h2><svg class="icon" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg> 로그인</h2>

      <form id="loginForm">
        <div class="auth-fields">
          <div class="auth-field">
            <label for="authEmail">이메일</label>
            <input id="authEmail" name="email" type="email" autocomplete="username" placeholder="example@email.com" required />
          </div>
          <div class="auth-field">
            <label for="authPassword">비밀번호</label>
            <div class="password-field">
              <input id="authPassword" name="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required />
              <button id="togglePassword" class="icon-btn" type="button" title="비밀번호 표시" aria-label="비밀번호 표시" aria-pressed="false">
                <svg class="icon eye-on" aria-hidden="true" viewBox="0 0 24 24"><use href="assets/icons/lucide.svg#eye"></use></svg>
                <svg class="icon eye-off" aria-hidden="true" viewBox="0 0 24 24"><use href="assets/icons/lucide.svg#eye-off"></use></svg>
              </button>
            </div>
          </div>
          <div class="auth-actions">
            <button id="signInBtn" type="submit" class="btn primary"><span class="button-label">로그인</span></button>
            <button id="signUpBtn" type="button" class="btn"><span class="button-label">회원가입</span></button>
          </div>
        </div>
      </form>

      <!-- User Info (shown when logged in) -->
      <div id="userInfo" style="display:none">
        <div class="row">
          <span>로그인됨: <strong id="userEmail"></strong></span>
          <div style="flex:1"></div>
          <button id="signOutBtn" class="btn small">로그아웃</button>
        </div>
      </div>

      <!-- Session Section (shown when logged in) -->
      <div id="sessionSection" style="display:none; margin-top:12px">
        <div class="separator"></div>
        <div class="row">
          <div style="flex:2">
            <label for="sessionCode">세션 코드</label>
            <input id="sessionCode" type="text" placeholder="예: 제주도여행2024" />
          </div>
          <div style="flex:0 0 auto">
            <label>&nbsp;</label>
            <button id="joinSessionBtn" class="btn primary">세션 참가</button>
          </div>
        </div>
        <div id="sessionStatus" style="display:none; margin-top:8px">
          <span class="tag">현재 세션: <strong id="currentSession"></strong></span>
        </div>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <div class="row">
          <h2 style="margin:0"><svg class="icon" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
            </svg> 지출 추가</h2>
        </div>
        <div class="row">
          <div>
            <label for="expTitle">항목명</label>
            <input id="expTitle" type="text" placeholder="예: 점심 / 택시 / 입장료" />
          </div>
          <div>
            <label for="expAmount">금액</label>
            <div class="row" style="gap:4px">
              <input id="expAmount" type="number" inputmode="decimal" min="0" step="1" placeholder="0"
                style="flex:2" />
              <select id="expCurrency" aria-label="통화" style="flex:1">
                <option value="KRW">₩ 원</option>
                <option value="USD">$ 달러</option>
                <option value="JPY">¥ 엔</option>
                <option value="EUR">€ 유로</option>
                <option value="CNY">¥ 위안</option>
                <option value="GBP">£ 파운드</option>
              </select>
            </div>
          </div>
        </div>
        <div id="exchangeRateRow" class="row" style="display:none">
          <div style="flex:1"></div>
          <div>
            <label for="expExchangeRate">환율 (1 외화 = ? 원)</label>
            <input id="expExchangeRate" type="number" inputmode="decimal" min="0" step="0.01" placeholder="예: 1350" />
          </div>
        </div>
        <div class="row align-start">
          <div>
            <label for="expPayer">결제자</label>
            <select id="expPayer"></select>
          </div>
          <div>
            <label>참여자</label>
            <div id="beneficiariesBox" class="chips"></div>
            <div class="row" style="margin-top:6px">
              <button id="selectAllBeneficiaries" class="btn small">전체 선택</button>
              <button id="clearAllBeneficiaries" class="btn small">전체 해제</button>
            </div>
          </div>
        </div>
        <!-- 분배 방식 -->
        <div class="row" role="group" aria-label="분배 방식" style="margin-top:8px">
          <label><input type="radio" name="splitMode" id="splitEqual" value="equal" checked> 균등 분배</label>
          <label><input type="radio" name="splitMode" id="splitCustom" value="custom"> 개별 금액</label>
        </div>
        <div id="customShares" class="custom-shares"></div>
        <div class="row" style="margin-top:8px">
          <div style="flex:1 1 auto"></div>
          <button id="addExpenseBtn" class="btn primary">지출 추가</button>
          <button id="cancelEditBtn" class="btn" style="display:none">편집 취소</button>
        </div>
      </section>

      <section class="card" aria-labelledby="resultTitle">
        <h2 id="resultTitle"><svg class="icon" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg> 참가자 & 정산 결과</h2>

        <!-- Moved Participants Section -->
        <div class="row">
          <div>
            <label for="participantName">이름</label>
            <input id="participantName" type="text" placeholder="예: 지민" />
          </div>
          <div style="flex:0 0 auto">
            <label>&nbsp;</label>
            <button id="addParticipantBtn" class="btn">추가</button>
          </div>
        </div>
        <div id="participantsList" class="chips" style="margin-top:10px"></div>
        <div class="separator"></div>

        <div id="balances"></div>
        <div class="separator"></div>
        <div id="settlements"></div>
      </section>
    </div>

    <section class="card" style="margin-top:16px">
      <h2><svg class="icon" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16" />
        </svg> 지출 목록</h2>
      <div class="footer-note" id="expensesHint">등록된 지출이 없습니다.</div>
      <div style="overflow:auto">
        <table id="expensesTable" style="min-width:740px; display:none">
          <thead>
            <tr>
              <th style="width:28%">항목</th>
              <th class="right" style="width:12%">금액</th>
              <th style="width:14%">결제자</th>
              <th>참여자</th>
              <th class="right" style="width:16%">1인분</th>
              <th style="width:130px">동작</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts -->
  <script src="ui.js"></script>
  <script src="app.js"></script>
  <script src="firebase-config.js"></script>

  <!-- Auth Event Listeners -->
  <script>
    document.getElementById('togglePassword').addEventListener('click', (event) => {
      const input = document.getElementById('authPassword');
      const visible = input.type === 'password';
      input.type = visible ? 'text' : 'password';
      event.currentTarget.title = visible ? '비밀번호 숨기기' : '비밀번호 표시';
      event.currentTarget.setAttribute('aria-pressed', String(visible));
      event.currentTarget.setAttribute('aria-label', visible ? '비밀번호 숨기기' : '비밀번호 표시');
    });

    // Sign In
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      if (!email || !password) {
        alert('이메일과 비밀번호를 입력하세요.');
        return;
      }
      await TripUI.runBusy(document.getElementById('signInBtn'), () => signIn(email, password),
        [document.getElementById('signInBtn'), document.getElementById('signUpBtn')]);
    });

    // Sign Up
    document.getElementById('signUpBtn').addEventListener('click', async () => {
      if (!document.getElementById('loginForm').reportValidity()) return;
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      if (!email || !password) {
        alert('이메일과 비밀번호를 입력하세요.');
        return;
      }
      if (password.length < 6) {
        alert('비밀번호는 6자 이상이어야 합니다.');
        return;
      }
      await TripUI.runBusy(document.getElementById('signUpBtn'), () => signUp(email, password),
        [document.getElementById('signInBtn'), document.getElementById('signUpBtn')]);
    });

    // Sign Out
    document.getElementById('signOutBtn').addEventListener('click', () => {
      signOut();
    });

    // Join Session
    document.getElementById('joinSessionBtn').addEventListener('click', () => {
      const sessionCode = document.getElementById('sessionCode').value.trim();
      joinSession(sessionCode);
    });

    // Currency change handler
    async function fetchExchangeRate(currency) {
      if (currency === 'KRW') return 1;
      try {
        // Free API: exchangerate-api.com (no key required for basic use)
        const res = await fetch(`https://api.exchangerate-api.com/v4/latest/${currency}`);
        const data = await res.json();
        if (data && data.rates && data.rates.KRW) {
          return Math.round(data.rates.KRW * 100) / 100;
        }
      } catch (e) {
        console.warn('Exchange rate API failed:', e);
      }
      return 0; // 실패 시 0 반환
    }

    document.getElementById('expCurrency').addEventListener('change', async (e) => {
      const currency = e.target.value;
      const rateRow = document.getElementById('exchangeRateRow');
      const rateInput = document.getElementById('expExchangeRate');

      if (currency === 'KRW') {
        rateRow.style.display = 'none';
        rateInput.value = '';
      } else {
        rateRow.style.display = 'flex';
        rateInput.placeholder = '로딩중...';
        const rate = await fetchExchangeRate(currency);
        rateInput.value = rate;
        rateInput.placeholder = '예: ' + rate;
      }
    });
  </script>

  <footer style="text-align:center; padding:24px 16px; color:#5a6a82; font-size:12px;">
    <button id="contactBtn" class="btn small" style="margin-top:8px;">개발자에게 문의하기</button>
  </footer>

  <!-- Contact Modal -->
  <dialog id="contactModal" aria-labelledby="contactTitle">
    <div class="card">
      <h2 id="contactTitle">개발자에게 문의</h2>
      <form id="contactForm" action="" method="POST">
        <input type="hidden" name="_subject" value="[Trip Splitter] 문의" />
        <input type="hidden" name="_captcha" value="false" />
        <div style="margin-bottom:12px;">
          <label for="contactEmail">회신받을 이메일</label>
          <input type="email" name="email" id="contactEmail" required placeholder="your@email.com" />
        </div>
        <div style="margin-bottom:12px;">
          <label for="contactMessage">문의 내용</label>
          <textarea name="message" id="contactMessage" required rows="5"
            placeholder="문의 내용을 입력하세요..."></textarea>
        </div>
        <div class="row" style="justify-content:flex-end; gap:8px;">
          <button type="button" id="closeModalBtn" class="btn">취소</button>
          <button type="submit" class="btn primary"><span class="button-label">보내기</span></button>
        </div>
      </form>
    </div>
  </dialog>

  <script>
    // Contact modal logic
    const modal = document.getElementById('contactModal');
    const form = document.getElementById('contactForm');

    // Build form action dynamically to hide email
    const p1 = 'imjungwon2005';
    const p2 = 'gmail.com';
    const formEndpoint = 'https://formsubmit.co/ajax/' + p1 + '@' + p2;

    document.getElementById('contactBtn').addEventListener('click', () => {
      TripUI.openDialog(modal);
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      TripUI.closeDialog(modal);
    });

    modal.addEventListener('cancel', (event) => {
      event.preventDefault();
      TripUI.closeDialog(modal);
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        TripUI.closeDialog(modal);
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // 페이지 이동 방지

      const formData = new FormData(form);

      await TripUI.runBusy(form.querySelector('button[type="submit"]'), async () => {
        try {
          const response = await fetch(formEndpoint, {
            method: 'POST',
            body: formData,
            headers: {
              'Accept': 'application/json'
            }
          });

          if (response.ok) {
            alert('문의가 전송되었습니다. 감사합니다!');
            form.reset();
            await TripUI.closeDialog(modal);
          } else {
            alert('전송에 실패했습니다. 다시 시도해 주세요.');
          }
        } catch (error) {
          console.error('Error:', error);
          alert('전송 중 오류가 발생했습니다.');
        }
      });
    });
  </script>
</body>

</html>
